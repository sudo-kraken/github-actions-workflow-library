# Copy this file to .github/workflows/codeql-actions.yml.
# This scans the workflow code in .github/workflows and local actions.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CodeQL - GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: "29 4 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
          queries: +security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions
