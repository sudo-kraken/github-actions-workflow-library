# Copy this file to .github/workflows/gitleaks.yml.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Install and run Gitleaks
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$GOBIN/gitleaks" git --redact --no-banner --verbose .
