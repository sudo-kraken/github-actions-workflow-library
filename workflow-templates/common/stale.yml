# Copy this file to .github/workflows/stale.yml.
# Edit the labels and timings before enabling it.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: stale-items
  cancel-in-progress: false

jobs:
  stale:
    name: Process stale items
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark and close stale items
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          any-of-labels: "pending author response"
          days-before-stale: 30
          days-before-close: 30
          stale-issue-label: stale
          stale-issue-message: >-
            This issue has had no activity for 30 days. Add an update to keep it open.
          close-issue-message: >-
            This issue was closed after a further 30 days without an update.
          stale-pr-label: stale
          stale-pr-message: >-
            This pull request has had no activity for 30 days. Add an update to keep it open.
          close-pr-message: >-
            This pull request was closed after a further 30 days without an update.
