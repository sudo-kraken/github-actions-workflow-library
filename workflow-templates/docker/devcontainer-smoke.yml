# Copy this file to .github/workflows/devcontainer-smoke.yml.
# Optional: add .devcontainer/test.sh for repository-specific checks.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Dev container smoke test

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-smoke.yml
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-smoke.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and test dev container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test the dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            bash -lc '
              set -euo pipefail
              if [ -f .devcontainer/test.sh ]; then
                bash .devcontainer/test.sh
              else
                id
                git --version
                echo "Dev container started successfully."
              fi
            '
