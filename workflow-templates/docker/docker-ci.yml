# Copy this file to .github/workflows/docker-ci.yml.
#
# Edit the Dockerfile, build context, platforms and Trivy severity below if needed.
# This defaults to pull requests and merge queues. Add a push trigger for main if
# the repository does not also use docker-publish.yml.
# Optional: copy one of the smoke scripts from this repository to
# .github/scripts/container-smoke.sh in the target repository.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Docker CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONTEXT: .
  DOCKERFILE: Dockerfile
  TRIVY_VERSION: v0.72.0
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  configuration:
    name: Scan container configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scan Docker and infrastructure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: ${{ env.TRIVY_SEVERITY }}

  image:
    name: Build and scan - ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            smoke: true
          - platform: linux/arm64
            slug: arm64
            smoke: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the exact test candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: local/ci:${{ matrix.slug }}
          cache-from: type=gha,scope=docker-ci-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=docker-ci-${{ matrix.slug }}
          provenance: false

      - name: Scan the exact test candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: local/ci:${{ matrix.slug }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: ${{ env.TRIVY_SEVERITY }}

      - name: Run repository smoke test
        if: ${{ matrix.smoke && hashFiles('.github/scripts/container-smoke.sh') != '' }}
        shell: bash
        env:
          IMAGE_REF: local/ci:${{ matrix.slug }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bash .github/scripts/container-smoke.sh
