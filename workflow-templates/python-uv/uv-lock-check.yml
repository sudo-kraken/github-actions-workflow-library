# Copy this file to .github/workflows/uv-lock-check.yml when a repository only
# needs a lightweight lockfile check. The full Python CI workflow already does this.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Check uv lockfile

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: uv-lock-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  lockfile:
    name: Check uv.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the lockfile
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
